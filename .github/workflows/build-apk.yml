name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại build (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main, master]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK với Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: android ${{ github.event.inputs.build_type || 'debug' }}
          buildozer_version: stable
          workdir: .

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: .buildozer/android/platform/build-*/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xsmb-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: In thông tin APK
        if: success()
        run: |
          echo "=== APK đã build xong ==="
          ls -lh bin/*.apk
