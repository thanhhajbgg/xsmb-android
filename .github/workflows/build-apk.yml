name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Loại build (debug hoặc release)"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt dependencies hệ thống
        run: |
          apt-get update
          apt-get install -y --no-install-recommends wget
          
          # Tải và cài đặt thủ công libtinfo5 từ mirror của kernel.org
          # (Gói này đã bị xóa khỏi các phiên bản Ubuntu mới hơn)
          wget https://mirrors.kernel.org/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
          apt-get install -y ./libtinfo5_6.3-2ubuntu0.1_amd64.deb
          
          # Cài đặt các gói phụ thuộc còn lại
          apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            automake autopoint

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Xác định loại build
        id: build_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.build_type }}" >> $GITHUB_OUTPUT
          else
            echo "type=debug" >> $GITHUB_OUTPUT
          fi

      - name: Build APK
        run: |
          yes | buildozer -v android ${{ steps.build_type.outputs.type }} 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xsmb-apk-${{ steps.build_type.outputs.type }}
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log (nếu lỗi)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
