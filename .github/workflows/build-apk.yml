name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại build (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main, master]

jobs:
  build:
    name: Build APK trong kivy/buildozer
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cho phép git trong container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Cài thêm thư viện hệ thống thiếu cho p4a
        run: |
          apt-get update || true
          apt-get install -y --no-install-recommends \
            libtinfo5 libncurses5 libncursesw5 \
            libjpeg-turbo8 libjpeg-turbo8-dev \
            libfreetype6 libfreetype6-dev \
            zlib1g-dev libssl-dev libffi-dev \
            || echo "Một số gói không cài được, tiếp tục..."

      - name: Kiểm tra môi trường
        run: |
          echo "Python: $(python --version 2>&1)"
          echo "Buildozer: $(buildozer --version 2>&1)"
          echo "SDK: $ANDROIDSDK"
          echo "NDK: $ANDROIDNDK"

      - name: Xóa cache cũ (nếu có)
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a || true

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          set -o pipefail
          buildozer -v android ${{ github.event.inputs.build_type || 'debug' }} 2>&1 | tee build.log

      - name: In 200 dòng cuối log (nếu fail)
        if: failure()
        run: |
          echo "=========================="
          echo "200 DÒNG CUỐI BUILD LOG"
          echo "=========================="
          tail -200 build.log || true
          echo "=========================="
          echo "CÁC DÒNG CÓ TỪ KHÓA LỖI"
          echo "=========================="
          grep -niE "error|failed|traceback|not found|no module|cannot" build.log | tail -50 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xsmb-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: In thông tin APK
        if: success()
        run: |
          echo "=== APK đã build xong ==="
          ls -lh bin/*.apk
