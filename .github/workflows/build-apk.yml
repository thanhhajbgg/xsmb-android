name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: node --check web/app.js

  build:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake autopoint gettext libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake \
            libffi-dev libssl-dev build-essential ccache
          python -m pip install -r requirements-build.txt
      - name: Cache downloaded Android tools
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform
          key: android-tools-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements-build.txt') }}
      - name: Build installable debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Verify APK signature
        shell: bash
        run: |
          apk=$(find bin -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          signer=$(find "$HOME/.buildozer/android/platform/android-sdk/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --verbose "$apk"
          sha256sum "$apk" > bin/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XSMB-Android-debug
          path: |
            bin/*.apk
            bin/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XSMB-build-log
          path: build.log
          if-no-files-found: ignore
